<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171B3A"/>
      <stop offset="0.55" stop-color="#0E1126"/>
      <stop offset="1" stop-color="#06070D"/>
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="4" x2="40" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- The wordmark's "spy" gradient: cyan → blue-violet → purple -->
    <linearGradient id="refract" x1="16" y1="12" x2="46" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45DCD8"/>
      <stop offset="0.5" stop-color="#6D6BFF"/>
      <stop offset="1" stop-color="#B06BFF"/>
    </linearGradient>
    <radialGradient id="dot" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(48 14.4) scale(5.5)">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#7BF1EC"/>
      <stop offset="1" stop-color="#45DCD8"/>
    </radialGradient>
  </defs>

  <!-- Dark glass tile with a lit top rim -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="16.25" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- Monogram "t" in the Unbounded style: heavy rounded stem, crossbar and a curved foot -->
  <path d="M26 14.5V39.5C26 45.3 30.2 49.5 36 49.5H41" stroke="url(#refract)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M17 25.5H38.5" stroke="url(#refract)" stroke-width="9" stroke-linecap="round"/>

  <!-- The live dot -->
  <circle cx="48" cy="14.5" r="8" fill="#45DCD8" opacity="0.22"/>
  <circle cx="48" cy="14.5" r="4.6" fill="url(#dot)"/>
</svg>
